name: Integration

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'integration')
    name: E2E ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    services:
      grid:
        image: selenium/standalone-${{ matrix.browser }}:4
        ports:
          - 4444:4444
        options: >-
          --shm-size=2gb
          --health-cmd "curl -fsSL http://localhost:4444/status || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      SELENIUM_E2E: '1'
      SELENIUM_HOST: http://localhost:4444/wd/hub
      SELENIUM_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Wait for grid
        run: |
          for i in $(seq 1 60); do
            if curl -fsSL http://localhost:4444/status >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Run Feature suite
        run: vendor/bin/phpunit --testsuite=Feature || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: build/screenshots
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: build/allure-results
          if-no-files-found: ignore
